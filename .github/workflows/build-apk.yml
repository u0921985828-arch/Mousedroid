name: Build APK

# Este proyecto ya es una app Kotlin nativa, no un WebView: aqui solo hace falta
# la parte de CI de la guia. El motivo de compilar fuera es el escollo conocido:
# en el entorno donde se escribe el codigo, dl.google.com esta bloqueado y no se
# puede resolver el plugin de Android, asi que el unico sitio donde se sabe de
# verdad si compila es un runner con internet.

on:
  workflow_dispatch:
  push:
    # Sin filtro de rama a proposito: lo que acota el disparo son las rutas, asi
    # que esto sigue funcionando si la rama se renombra o el proyecto se mueve.
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # para dejar el APK en la rama 'apk'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'        # jvmTarget del proyecto; AGP 8.5.2 va bien con 17

      - uses: android-actions/setup-android@v3
        with:
          # Por defecto pide el paquete 'tools', que ya no existe en las
          # cmdline-tools actuales y tumba a sdkmanager con codigo 1. Se piden
          # a mano los que necesita compileSdk 34 en vez de fiarlo a que AGP
          # se los descargue solo.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Compilar el APK de depuracion
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UsbMouse.apk

      # Con este nombre el vigilante del servidor lo encuentra solo: basta con
      # dejarlo en server/ y enchufar el movil.
      - uses: actions/upload-artifact@v4
        with:
          name: UsbMouse-apk
          path: UsbMouse.apk
          if-no-files-found: error

      # Ademas del artefacto, el APK va a una rama suelta que solo contiene ese
      # fichero. El artefacto obliga a pasar por la interfaz de Actions y a estar
      # identificado; la rama se descarga del propio repo y se puede traer con un
      # `git fetch`, que es lo unico que atraviesa algunas redes.
      - name: Publicar el APK en la rama 'apk'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp=$(mktemp -d)
          cp UsbMouse.apk "$tmp/"
          cd "$tmp"
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UsbMouse.apk
          git commit -q -m "APK de ${GITHUB_SHA:0:7}"
          # sin historia: cada build reemplaza el binario en vez de acumularlos
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

  smoke:
    # Compilar no es lo mismo que arrancar: esto comprueba que la Activity abre
    # y se queda abierta, que es donde se caeria un fallo de maquetacion o un
    # permiso que falta.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: UsbMouse-apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Una sola linea: esta accion ejecuta el script LINEA A LINEA, cada
          # una en su propio `sh -c`, asi que un if/then/fi repartido se parte.
          script: bash .github/scripts/smoke.sh UsbMouse.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pantallazo
          path: pantallazo.png
          if-no-files-found: warn
